services:
  lina-db:
    image: mysql:8.4
    container_name: lina_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password_lina
      MYSQL_DATABASE: lina_bd
      MYSQL_USER: lina_user
      MYSQL_PASSWORD: lina_password
    ports:
      - "3306:3306"
    volumes:
      - lina_mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

volumes:
  lina_mysql_data:
